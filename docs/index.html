<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2f6b4f">
  <title>Meal Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Google Identity Services: the "Sign in with Google" button -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#/tonight" class="brand">Meal Planner</a>
    <div class="topbar-actions">
      <button id="refresh-btn" class="icon-btn" title="Reload from the Sheet" aria-label="Reload" hidden>↻</button>
      <button id="signout-btn" class="text-btn" hidden>Sign out</button>
    </div>
  </header>

  <!-- Shown when the sign-in token has expired but cached data is on screen -->
  <div id="banner" class="banner" hidden></div>

  <main id="view" aria-live="polite">
    <p class="muted center">Loading…</p>
  </main>

  <nav class="tabbar" id="tabbar" hidden>
    <a href="#/tonight" data-tab="tonight">Tonight</a>
    <a href="#/week" data-tab="week">Week</a>
    <a href="#/recipes" data-tab="recipes">Recipes</a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
